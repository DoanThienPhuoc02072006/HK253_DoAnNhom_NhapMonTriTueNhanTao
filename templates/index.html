{% extends 'layout.html' %}

{% block content %}
<div class="form-container">
    <h1 class="page-title">Chẩn Đoán Bệnh Lý Hô Hấp</h1>
    <p class="subtitle">Vui lòng điền thông tin và các triệu chứng bạn đang gặp phải.</p>
      
    <form action="{{ url_for('diagnose') }}" method="POST" class="diagnosis-form" onsubmit="return validateForm()">
        <div class="left-panel panel">
            <h2>Thông tin bệnh nhân</h2>
            <div class="form-group">
                <label>Họ tên:</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Tuổi:</label>
                <input type="number" name="age" required min="0" max="120">
            </div>
            <div class="form-group">
                <label>Giới tính:</label>
                <select name="gender" required>
                    <option value="">-- Chọn --</option>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                </select>
